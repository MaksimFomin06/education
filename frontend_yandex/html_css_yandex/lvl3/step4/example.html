<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Эффект появления</title>
    <style>
      .card {
        width: 250px;
        padding: 20px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
    </style>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="padding: 20px">
    <div class="card">
      <h3>Эта карточка появилась плавно</h3>
    </div>
  </body>
</html>
