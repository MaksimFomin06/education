<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Галерея с подписями</title>
    <style>
      .gallery {
        display: flex; /* Для расположения элементов в ряд */
        gap: 15px; /* Расстояние между элементами */
      }
      .gallery-item img {
        display: block; /* Убирает отступ под картинкой */
        max-width: 100%;
      }
    </style>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="gallery">
      <div class="gallery-item">
        <img
          alt="Город"
          src="https://contest.yandex.ruhttps://thumbs.dreamstime.com/b/new-york-city-beautiful-colorful-sunset-over-manhattan-45329626.jpg"
        />
        <div class="caption">Городской пейзаж</div>
      </div>
      <div class="gallery-item">
        <img
          alt="Природа"
          src="https://contest.yandex.ruhttps://thumbs.dreamstime.com/b/tranquil-forest-waterfall-sunlit-canopy-lush-green-surroundings-serene-cascades-pool-surrounded-greenery-372137247.jpg"
        />
        <div class="caption">Лесной водопад</div>
      </div>
    </div>
  </body>
</html>
