version: "3.9"

services:
  api:
    build: .
    env_file: .env.example
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  worker:
    build: .
    env_file: .env.example
    depends_on:
      - redis
      - postgres
    command: celery -A app.tasks.celery_app worker -l info

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: slotkeeper
      POSTGRES_USER: slotkeeper
      POSTGRES_PASSWORD: slotkeeper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
